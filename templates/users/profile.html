{% extends 'base.html' %}
{% block title %}Личный кабинет — {{ site_name }}{% endblock %}

{% block content %}
<h1>Настройки профиля</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" value="{{ user.email }}" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Телефон</label>
        <input type="text" name="phone" value="{{ user.profile.phone }}" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Город</label>
        <input type="text" name="city" value="{{ user.profile.city }}" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Аватар</label>
        {% if user.profile.avatar %}
            <img src="{{ user.profile.avatar.url }}" width="50" class="mb-2"><br>
        {% endif %}
        <input type="file" name="avatar" class="form-control">
    </div>
<div class="mb-3">
    <label class="form-label">Тип профиля</label>
    <select name="profile_type" class="form-select">
        <option value="person" {% if user.profile.profile_type == 'person' %}selected{% endif %}>Частное лицо</option>
        <option value="company" {% if user.profile.profile_type == 'company' %}selected{% endif %}>Компания</option>
    </select>
</div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
</form>
{% endblock %}
