{% extends 'base.html' %}
{% load static %}

{% block title %}Смена пароля — {{ site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3 text-center">Смена пароля</h1>
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary w-100">Изменить пароль</button>
        </form>
        <p class="mt-3 mb-0 text-center">
          <a href="{% url 'users:profile' %}">Назад к настройкам</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
