{% extends 'base.html' %}
{% block title %}Удаление — {{ listing.title }}{% endblock %}
{% block content %}
<h1>Удалить объявление?</h1>
<p>Вы уверены, что хотите удалить «{{ listing.title }}»? Это действие нельзя отменить.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Удалить</button>
  <a href="{% url 'listings:detail' listing.pk %}">Отмена</a>
</form>
{% endblock %}
