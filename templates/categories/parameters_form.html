{% load url_helpers %}

{% for param in parameters %}
  <div class="mb-3">
    <label class="form-label">{{ param.name }}</label>
    {% if param.mask == 'number' %}
      <input type="number" name="param_{{ param.slug }}" class="form-control form-control-sm"
             placeholder="{{ param.placeholder|default:'' }}"
             {% if param.is_required %}required{% endif %}>
    {% elif param.mask == 'text' %}
      <input type="text" name="param_{{ param.slug }}" class="form-control form-control-sm"
             placeholder="{{ param.placeholder|default:'' }}"
             {% if param.is_required %}required{% endif %}>
    {% else %}
      <select name="param_{{ param.slug }}" class="form-select form-select-sm"
              {% if param.is_required %}required{% endif %}>
        <option value="">{{ param.placeholder|default:'Выберите...' }}</option>
        {% for choice in param.get_choices_list %}
          <option value="{{ choice }}">{{ choice }}</option>
        {% endfor %}
      </select>
    {% endif %}
  </div>
{% endfor %}
