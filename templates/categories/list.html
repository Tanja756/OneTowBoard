{% extends 'base.html' %}
{% block title %}Категории — OneTwoBoard{% endblock %}
{% block content %}
<h1>Категории</h1>
<ul>
{% for category in categories %}
    <li><a href="{% url 'categories:detail' category.slug %}">{{ category.name }}</a></li>
{% empty %}
    <li>Нет категорий</li>
{% endfor %}
</ul>
{% endblock %}
